services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: propos
      POSTGRES_USER: propos
      POSTGRES_PASSWORD: propos
    ports:
      - "5432:5432"
    volumes:
      - propos_pg:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./server/migrations/002_workflow_execution.sql:/docker-entrypoint-initdb.d/02-workflow-execution.sql:ro
      - ./server/migrations/003_auth_security.sql:/docker-entrypoint-initdb.d/03-auth-security.sql:ro
      - ./server/seed.sql:/docker-entrypoint-initdb.d/04-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propos -d propos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  propos_pg:
